name: checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the workflow never writes back, so a permissive account default
# cannot hand a write-scoped token to a run triggered from a fork.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request, check the branch itself, not GitHub's test merge
          # commit: GitHub authors that commit with the account's private email,
          # so check-leaks would fail every PR on a commit that never lands.
          # main is fast-forwarded, so the branch head is what lands.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # lint-plugin reads the latest tag; check-leaks reads history.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The shell-env hook test exercises zsh and checks discovery of lsof.
      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh lsof
      - uses: oven-sh/setup-bun@v2
      # Same entry point as local, so the two cannot drift.
      - run: scripts/verify.sh
